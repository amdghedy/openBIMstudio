[package]
name = "obim-cad-engine"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "WASM bridge around acadrust (MPL-2.0): native-grade DXF/DWG reading for openBIMstudio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acadrust = { version = "0.6.8", default-features = false }

# Replace the wasm-bindgen-backed web-time with a std-backed shim so the
# wasm build has zero JS imports (loads as a plain WebAssembly module).
[patch.crates-io]
web-time = { path = "web-time-shim" }


# Keep memory modest: the sandbox OOM-kills rustc on fat LTO builds.
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
