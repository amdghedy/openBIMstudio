name: UI defaults panel closed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Close tool panel + collapse ribbon tabs by default
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/shell/ribbon.ts")
          t = p.read_text()

          if "let leftPanelVisible = true;" in t:
              t = t.replace("let leftPanelVisible = true;", "let leftPanelVisible = false;", 1)
              print("leftPanelVisible -> false")
          elif "let leftPanelVisible = false;" in t:
              print("leftPanelVisible already false")
          else:
              raise SystemExit("leftPanelVisible not found")

          old_min = (
              "let ribbonMinimized = false;\n"
              "try {\n"
              '  ribbonMinimized = localStorage.getItem("obs.ribbon.minimized") === "1";\n'
              "} catch { /* */ }"
          )
          new_min = (
              "// Default: ribbon strip collapsed (tabs only). Expand via double-click tab row.\n"
              "let ribbonMinimized = true;\n"
              "try {\n"
              '  const stored = localStorage.getItem("obs.ribbon.minimized");\n'
              '  // Prefer collapsed; only expand if user explicitly stored "0"\n'
              '  if (stored === "0") ribbonMinimized = false;\n'
              "  else ribbonMinimized = true;\n"
              "} catch { /* */ }"
          )
          if old_min in t:
              t = t.replace(old_min, new_min, 1)
              print("ribbonMinimized -> default true")
          elif "let ribbonMinimized = true;" in t:
              print("ribbonMinimized already default true")
          else:
              raise SystemExit("ribbonMinimized block not found")

          start = t.find("  ctx.leftHost.style.cssText =")
          if start < 0:
              raise SystemExit("leftHost cssText not found")
          end = t.find("\n  // Wheel over left dock", start)
          if end < 0:
              raise SystemExit("wheel comment anchor not found")
          if "Tool panel starts closed" not in t[start:end + 200]:
              inject = (
                  "\n  // Tool panel starts closed (open via View \u2192 Tools)\n"
                  "  if (!leftPanelVisible) {\n"
                  '    ctx.leftHost.style.display = "none";\n'
                  "  }"
              )
              t = t[:end] + inject + t[end:]
              print("injected leftHost display:none on setup")
          else:
              print("leftHost closed-init already present")

          p.write_text(t)
          print("ribbon.ts updated, size", p.stat().st_size)
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shell/ribbon.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(ui): tool panel closed by default, ribbon tabs collapsed"
          git push origin HEAD:main
