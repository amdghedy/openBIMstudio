name: UI defaults panel closed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Close tool panel + collapse ribbon tabs by default
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/shell/ribbon.ts")
          t = p.read_text()

          # 1) Tool panel starts closed
          if "let leftPanelVisible = true;" in t:
              t = t.replace("let leftPanelVisible = true;", "let leftPanelVisible = false;", 1)
              print("leftPanelVisible -> false")
          elif "let leftPanelVisible = false;" in t:
              print("leftPanelVisible already false")
          else:
              raise SystemExit("leftPanelVisible not found")

          # 2) Ribbon tabs strip starts collapsed
          old_min = (
              "let ribbonMinimized = false;\n"
              "try {\n"
              '  ribbonMinimized = localStorage.getItem("obs.ribbon.minimized") === "1";\n'
              "} catch { /* */ }"
          )
          new_min = (
              "// Default: ribbon strip collapsed (tabs only). Expand via double-click tab row.\n"
              "let ribbonMinimized = true;\n"
              "try {\n"
              '  const stored = localStorage.getItem("obs.ribbon.minimized");\n'
              '  // Prefer collapsed; only expand if user explicitly stored "0"\n'
              '  if (stored === "0") ribbonMinimized = false;\n'
              "  else ribbonMinimized = true;\n"
              "} catch { /* */ }"
          )
          if old_min in t:
              t = t.replace(old_min, new_min, 1)
              print("ribbonMinimized -> default true")
          elif "let ribbonMinimized = true;" in t:
              print("ribbonMinimized already default true")
          else:
              raise SystemExit("ribbonMinimized block not found")

          # 3) Hide left host on setup when panel is closed
          old_css = (
              '  ctx.leftHost.style.cssText =\n'
              '    "height:100%;overflow-y:auto;overflow-x:hidden;" +\n'
              '    "background:var(--bg-base);border-right:1px solid var(--border-default);" +\n'
              '    "display:flex;flex-direction:column.";'
          )
          # fix typo: column."; should be column.";
          old_css = (
              "  ctx.leftHost.style.cssText =\n"
              '    "height:100%;overflow-y:auto;overflow-x:hidden;" +\n'
              '    "background:var(--bg-base);border-right:1px solid var(--border-default);" +\n'
              '    "display:flex;flex-direction:column.";'
          )
          PY
