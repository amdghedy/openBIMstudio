name: Native BIM validation

on:
  pull_request:
    paths:
      - "src/modules/native-bim/**"
      - "src/modules/mep/**"
      - "src/modules/families/**"
      - "src/plugins/**"
      - "src/features/sheets-2d-panel.ts"
      - "src/features/authoring.ts"
      - "src/features/mep-fabrication.ts"
      - "tests/native-bim-validation.test.mjs"
      - "tests/mep-router.test.cjs"
      - "docs/NATIVE_BIM_VALIDATION.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-bim-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/modules/native-bim/**"
      - "src/modules/mep/**"
      - "src/modules/families/**"
      - "src/plugins/**"
      - "src/features/authoring.ts"
      - "src/features/mep-fabrication.ts"
      - "tests/native-bim-validation.test.mjs"
      - "tests/mep-router.test.cjs"
      - "docs/NATIVE_BIM_VALIDATION.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-bim-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/native-bim-validation.test.mjs
      # v66 milestone covers scope box + section box + crop region + all prior v40 modules
      - run: npm run verify:v66
      # MEP routing + sizing unit tests (compiles mep/*.ts to CJS + runs A* / ASHRAE assertions).
      - run: npm run test:mep
