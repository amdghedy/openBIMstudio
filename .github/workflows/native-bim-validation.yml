name: Native BIM validation

on:
  pull_request:
    paths:
      - "src/modules/native-bim/**"
      - "src/modules/mep/**"
      - "src/modules/families/**"
      - "src/plugins/**"
      - "src/features/sheets-2d-panel.ts"
      - "src/features/authoring.ts"
      - "src/features/mep-fabrication.ts"
      - "tests/native-bim-validation.test.mjs"
      - "tests/mep-router.test.cjs"
      - "docs/NATIVE_BIM_VALIDATION.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-bim-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/modules/native-bim/**"
      - "src/modules/mep/**"
      - "src/modules/families/**"
      - "src/plugins/**"
      - "src/features/authoring.ts"
      - "src/features/mep-fabrication.ts"
      - "tests/native-bim-validation.test.mjs"
      - "tests/mep-router.test.cjs"
      - "docs/NATIVE_BIM_VALIDATION.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-bim-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          npm ci || npm install
      - name: Align React 18 stack
        run: |
          npm install react@18.3.1 react-dom@18.3.1 @types/react@18.3.12 @types/react-dom@18.3.1 --no-fund --no-audit
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/native-bim-validation.test.mjs
      - run: npm run verify:v66
      - run: npm run test:mep
