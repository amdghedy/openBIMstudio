name: Native BIM validation

on:
  pull_request:
    paths:
      - "src/modules/native-bim/**"
      - "src/modules/mep/**"
      - "src/modules/families/**"
      - "src/plugins/**"
      - "src/features/authoring.ts"
      - "src/features/mep-fabrication.ts"
      - "tests/native-bim-validation.test.mjs"
      - "tests/mep-router.test.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-bim-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/modules/native-bim/**"
      - "src/modules/mep/**"
      - "src/modules/families/**"
      - "src/plugins/**"
      - "src/features/authoring.ts"
      - "src/features/mep-fabrication.ts"
      - "tests/native-bim-validation.test.mjs"
      - "tests/mep-router.test.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-bim-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Native BIM validation tests
        run: node tests/native-bim-validation.test.mjs
      - name: MEP tests
        run: npm run test:mep
