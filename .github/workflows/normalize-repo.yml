name: Repository terminology normalization

on:
  push:
    paths:
      - ".github/workflows/normalize-repo.yml"
      - "scripts/normalize-repo-terms.mjs"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Normalize tracked files
        run: node scripts/normalize-repo-terms.mjs
      - name: Commit changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          rm -f .github/workflows/normalize-repo.yml scripts/normalize-repo-terms.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes were required."
            exit 0
          fi
          git commit -m "chore: normalize repository vocabulary"
          git push origin "HEAD:${TARGET_BRANCH}"
