name: golden-roundtrip
# workflow_dispatch-only until P1-03 (golden corpus) + P1-04 (diff.ts implementation) land:
# scripts/golden-roundtrip.mjs needs src/core/interop/diff.ts and
# test/fixtures/ifc-corpus/, which do not exist yet. Flip to [push, pull_request, workflow_dispatch]
# when P1-04 is merged. See docs/engineering/STARTER_ARTIFACTS.md.
on: [workflow_dispatch]
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/golden-roundtrip.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-report
          path: interop-report.json
      - name: fail on snapshot regression
        run: |
          git diff --exit-code test/fixtures/ifc-corpus/snapshots ||
            (echo '::error::Interop regression: inspect interop-report.json' && exit 1)
