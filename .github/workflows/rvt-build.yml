name: Build Revit reader

# Builds the rvt-rs WebAssembly decoder (scripts/build-rvt-wasm.mjs), smoke-tests it on
# the upstream sample files, and pushes it on branch rvt-decoder-build (main needs a pull
# request) so it can be committed to public/rvt/ and served by every host (including ones
# with no Rust toolchain, such as Vercel). Run manually.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: node scripts/build-rvt-wasm.mjs --strict
      - name: Smoke test the built decoder on the upstream sample files (real wasm, real parse)
        run: |
          SHA=$(grep -oP 'RVT_RS_COMMIT = "\K[0-9a-f]+' scripts/build-rvt-wasm.mjs)
          for f in architectural-2024 structural-2023 mep-2024; do
            curl -fsSL -o "/tmp/$f.rvt" "https://raw.githubusercontent.com/DrunkOnJava/rvt-rs/$SHA/corpus/tier1/$f/$f.rvt"
            ls -l "/tmp/$f.rvt"
            node scripts/rvt-smoke.mjs "/tmp/$f.rvt" --expect-glb
          done
      - name: Commit the built decoder to a side branch (main is protected; merge it by pull request)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/rvt/rvt.js public/rvt/rvt_bg.wasm
          if git diff --cached --quiet; then echo "decoder unchanged"; exit 0; fi
          git commit -m "chore: built Revit reader (rvt-rs $(grep -oP 'RVT_RS_COMMIT = "\K.{7}' scripts/build-rvt-wasm.mjs))"
          git push --force origin HEAD:refs/heads/rvt-decoder-build
