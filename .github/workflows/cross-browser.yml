name: Cross-browser smoke (advisory)

# Firefox/WebKit run here, NOT in CI, so they can never block or cancel a
# release. In run 276fcd9 every Firefox test timed out (~31 s each).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Browser smoke (${{ matrix.browser }}, advisory)
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    continue-on-error: true
    # ubuntu-latest resolved to 26.04, which Playwright does not support yet
    # (pin 24.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright and supported browsers
        run: npm i --no-save @playwright/test@1.57.0 && npx playwright install --with-deps ${{ matrix.browser }}
      - name: Software GL stack (Firefox cannot create WebGL without Mesa/EGL on a GPU-less runner)
        if: matrix.browser == 'firefox'
        run: sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libegl-mesa0 mesa-utils xvfb
      - name: Build production app for browser tests
        run: npm run build
      - name: Boot probe (prints console, page errors and WebGL status)
        continue-on-error: true
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          node scripts/browser-boot-probe.mjs ${{ matrix.browser }}
          if [ "${{ matrix.browser }}" = firefox ]; then echo '--- headed under xvfb ---'; PROBE_HEADED=1 xvfb-run -a -s '-screen 0 1280x1024x24' node scripts/browser-boot-probe.mjs firefox; fi
          kill %1 || true
      - name: Run browser specs
        # document-chain = the core authoring→documentation→export chain in a
        # real browser (production bundle); edit-undo-save = state round-trip.
        # orbit-rtl/native-ifc/smoke stay from the original smoke set.
        run: npx playwright test --project=${{ matrix.browser }} tests/e2e/smoke.spec.ts tests/e2e/orbit-rtl.spec.ts tests/e2e/native-ifc-roundtrip.spec.ts tests/e2e/edit-undo-save.spec.ts tests/e2e/document-chain.spec.ts --reporter=list
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
