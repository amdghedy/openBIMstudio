name: Restore ribbon once

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore ribbon from 41edb8d and apply UX migration
        run: |
          git checkout 41edb8d -- src/shell/ribbon.ts
          python3 -c "
          from pathlib import Path
          p = Path('src/shell/ribbon.ts')
          src = p.read_text(encoding='utf-8')
          old = '''let ribbonMinimized = false;\ntry {\n  ribbonMinimized = localStorage.getItem(\"obs.ribbon.minimized\") === \"1\";\n} catch { /* */ }'''
          new = '''let ribbonMinimized = false;\ntry {\n  const migrated = localStorage.getItem(\"obs.ribbon.ux-migrated-v1\") === \"1\";\n  if (!migrated) {\n    localStorage.setItem(\"obs.ribbon.minimized\", \"0\");\n    localStorage.setItem(\"obs.ribbon.ux-migrated-v1\", \"1\");\n    ribbonMinimized = false;\n  } else {\n    ribbonMinimized = localStorage.getItem(\"obs.ribbon.minimized\") === \"1\";\n  }\n} catch { /* */ }'''
          if old not in src:
              raise SystemExit('anchor not found')
          p.write_text(src.replace(old, new, 1), encoding='utf-8')
          print('patched', p.stat().st_size)
          "

      - name: Commit and push
        run: |
          git config user.name "amdghedy"
          git config user.email "43811322+amdghedy@users.noreply.github.com"
          git add src/shell/ribbon.ts
          git status
          git commit -m "fix(ui): restore full ribbon.ts from 41edb8d + expand-by-default migration" || echo nochange
          git push origin HEAD:main
