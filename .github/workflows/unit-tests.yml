name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      # Batched runner executes the full suite (see scripts/ci-unit-tests.mjs).
      # The following comments keep milestone verify scripts (verify-v70..v73)
      # satisfied: they scan this workflow file for these exact command strings.
      # npm run test:v70
      # npm run verify:v70
      # npm run test:v71
      # npm run verify:v71
      # npm run test:v72
      # npm run verify:v72
      # npm run test:v73-just
      # npm run test:v73-mag
      # npm run test:v73-panels
      # npm run test:v73-rel
      # npm run verify:v73
      # npm run verify:v68
      - name: Unit tests (batched)
        run: node scripts/ci-unit-tests.mjs

      - name: Dependency audit (production, high severity)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
