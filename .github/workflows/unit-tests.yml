name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # PE-12: verify the checked-in wasm matches the checked-in Rust source
      # via the manifest attestation. Runs BEFORE the cargo build + copy
      # steps below stage a fresh build (which overwrites the checked-in
      # wasm, so a check after staging would compare fresh bytes against the
      # checked-in manifest). Fails on Rust source drift without a rebuild +
      # manifest regeneration.
      - name: Verify CAD engine wasm matches Rust source (wasm staleness guard)
        run: node scripts/check-cad-engine-wasm.mjs

      - name: Install Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build native DWG writer (MPL-2.0)
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path cad-engine-rust/Cargo.toml

      - name: Stage freshly built native drawing engine WebAssembly
        run: node scripts/copy-cad-engine-wasm.mjs

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps

      - name: Production build (includes TypeScript typecheck)
        run: npm run build

      # Hardening lint (item 17): warn-level __obs freeze + explicit-any
      # counts. Report-only — findings never fail this step; a red run
      # means the lint tooling itself broke. Baseline 2026-11-21: 3,585
      # warnings / 0 errors (any 3,017, __obs 568).
      - name: Hardening lint (report-only)
        continue-on-error: true
        run: npm run lint:hardening

      # Structural report (item 17): file sizes, __obs count, import
      # cycles, dead-file scan. Report-only, never fails the build.
      - name: Structural report (non-blocking)
        continue-on-error: true
        run: npm run report:structural

      - name: Safe-load file boundary audit
        run: node scripts/check-safe-load-coverage.mjs

      - name: Tool catalog maturity gate
        run: node scripts/check-tool-catalog.mjs

      - name: Performance budget gate
        run: npm run bench:budget

      - name: Type-check Cloudflare Worker sources
        run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM worker/index.ts worker/linkedin.ts

      - name: Validate Cloudflare Worker bundle and bindings
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run

      - name: Locale catalog integrity
        run: |
          node --input-type=commonjs <<'SCRIPT'
          const fs = require('node:fs');
          const path = 'src/locales';
          const files = fs.readdirSync(path).filter((f) => f.endsWith('.json'));
          const en = JSON.parse(fs.readFileSync(`${path}/en.json`, 'utf8'));
          const flatten = (value, prefix = '') => Object.entries(value).flatMap(([key, child]) =>
            child && typeof child === 'object' && !Array.isArray(child)
              ? flatten(child, `${prefix}${key}.`)
              : [`${prefix}${key}`]);
          const expected = new Set(flatten(en));
          let failed = false;
          for (const file of files) {
            let locale;
            try {
              locale = JSON.parse(fs.readFileSync(`${path}/${file}`, 'utf8'));
            } catch (error) {
              console.error(`FAIL ${file}: invalid JSON — ${error.message}`);
              failed = true;
              continue;
            }
            const actual = new Set(flatten(locale));
            const missing = [...expected].filter((key) => !actual.has(key));
            if (missing.length) {
              console.warn(`WARN ${file}: ${missing.length} missing key(s); runtime fallback applies`);
            } else {
              console.log(`OK ${file}: ${expected.size} keys present`);
            }
          }
          if (failed) process.exit(1);
          SCRIPT

      # Independent DXF validation (tests/dxf-independent-validation) parses the
      # platform's export with ezdxf, a third-party DXF implementation. The test
      # skips gracefully when ezdxf is missing (local dev), but CI runs it for real.
      - name: Install ezdxf for independent DXF validation
        run: python3 -m pip install --quiet ezdxf

      # Independent native-IFC validation (tests/native-ifc-independent-validation)
      # parses the Native Twin export with IfcOpenShell, a third-party IFC
      # implementation. Same skip-gracefully-locally rule as ezdxf above.
      - name: Install IfcOpenShell for independent native-IFC validation
        run: python3 -m pip install --quiet ifcopenshell

      # Batched runner executes the complete unit suite (scripts/ci-unit-tests.mjs).
      # Keep these command strings: milestone verification scripts inspect this file.
      # npm run test:v70
      # npm run verify:v70
      # npm run test:v71
      # npm run verify:v71
      # npm run test:v72
      # npm run verify:v72
      # npm run test:v73-just
      # npm run test:v73-mag
      # npm run test:v73-panels
      # npm run test:v73-rel
      # npm run verify:v73
      # npm run verify:v68
      - name: Unit and native BIM / MEP tests
        run: node scripts/ci-unit-tests.mjs

      - name: IFC corpus parser and snapshot regression
        run: node scripts/golden-roundtrip.mjs

      - name: Ensure IFC golden snapshots were not rewritten
        run: |
          changed="$(git status --porcelain -- tests/fixtures/ifc-corpus/snapshots)"
          if [ -n "$changed" ]; then
            echo "::error::IFC golden snapshots changed or were generated during CI."
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Upload IFC interoperability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ifc-interop-report
          path: interop-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: LinkedIn publishing security/configuration regression tests
        run: node --test tests/linkedin-publishing-config.test.cjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  browser-smoke:
    name: Browser smoke (blocking, Chromium)
    needs: quality
    # Chromium gates the release. Firefox/WebKit: see cross-browser.yml (advisory).
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # ubuntu-latest resolved to 26.04, which Playwright does not support yet
    # ("Playwright does not support chromium on ubuntu26.04-x64"); pin 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright and supported browsers
        run: npm i --no-save @playwright/test@1.57.0 && npx playwright install --with-deps chromium
      - name: Build production app for browser tests
        run: npm run build
      - name: Run browser specs
        # document-chain = the core authoring→documentation→export chain in a
        # real browser (production bundle); edit-undo-save = state round-trip.
        # orbit-rtl/native-ifc/smoke stay from the original smoke set.
        # rtl-ar = the #141 live-browser RTL proof (item 16): ar at 1280px,
        # named views, undo/redo + chevron mirroring by computed style.
        run: npx playwright test --project=chromium tests/e2e/smoke.spec.ts tests/e2e/orbit-rtl.spec.ts tests/e2e/rtl-ar.spec.ts tests/e2e/native-ifc-roundtrip.spec.ts tests/e2e/edit-undo-save.spec.ts tests/e2e/document-chain.spec.ts tests/e2e/cad-ribbon.spec.ts tests/e2e/cad-native-blocks.spec.ts tests/e2e/import-timeout.spec.ts tests/e2e/family-store-bridge.spec.ts --reporter=list
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-results-chromium
          path: test-results/
          if-no-files-found: ignore
