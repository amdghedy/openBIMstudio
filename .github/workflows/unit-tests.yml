name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build native DWG writer (MPL-2.0)
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path cad-engine-rust/Cargo.toml

      - name: Stage freshly built native drawing engine WebAssembly
        run: node scripts/copy-cad-engine-wasm.mjs

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps

      - name: Production build (includes TypeScript typecheck)
        run: npm run build

      - name: Type-check Cloudflare Worker sources
        run: npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --lib ES2022,DOM worker/index.ts worker/linkedin.ts

      - name: Validate Cloudflare Worker bundle and bindings
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run

      - name: Locale catalog integrity
        run: |
          node --input-type=commonjs <<'SCRIPT'
          const fs = require('node:fs');
          const path = 'src/locales';
          const files = fs.readdirSync(path).filter((f) => f.endsWith('.json'));
          const en = JSON.parse(fs.readFileSync(`${path}/en.json`, 'utf8'));
          const flatten = (value, prefix = '') => Object.entries(value).flatMap(([key, child]) =>
            child && typeof child === 'object' && !Array.isArray(child)
              ? flatten(child, `${prefix}${key}.`)
              : [`${prefix}${key}`]);
          const expected = new Set(flatten(en));
          let failed = false;
          for (const file of files) {
            let locale;
            try {
              locale = JSON.parse(fs.readFileSync(`${path}/${file}`, 'utf8'));
            } catch (error) {
              console.error(`FAIL ${file}: invalid JSON — ${error.message}`);
              failed = true;
              continue;
            }
            const actual = new Set(flatten(locale));
            const missing = [...expected].filter((key) => !actual.has(key));
            if (missing.length) {
              console.warn(`WARN ${file}: ${missing.length} missing key(s); runtime fallback applies`);
            } else {
              console.log(`OK ${file}: ${expected.size} keys present`);
            }
          }
          if (failed) process.exit(1);
          SCRIPT

      # Batched runner executes the complete unit suite (scripts/ci-unit-tests.mjs).
      # Keep these command strings: milestone verification scripts inspect this file.
      # npm run test:v70
      # npm run verify:v70
      # npm run test:v71
      # npm run verify:v71
      # npm run test:v72
      # npm run verify:v72
      # npm run test:v73-just
      # npm run test:v73-mag
      # npm run test:v73-panels
      # npm run test:v73-rel
      # npm run verify:v73
      # npm run verify:v68
      - name: Unit and native BIM / MEP tests
        run: node scripts/ci-unit-tests.mjs

      - name: IFC corpus parser and snapshot regression
        run: node scripts/golden-roundtrip.mjs

      - name: Ensure IFC golden snapshots were not rewritten
        run: |
          changed="$(git status --porcelain -- tests/fixtures/ifc-corpus/snapshots)"
          if [ -n "$changed" ]; then
            echo "::error::IFC golden snapshots changed or were generated during CI."
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Upload IFC interoperability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ifc-interop-report
          path: interop-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: LinkedIn publishing security/configuration regression tests
        run: node --test tests/linkedin-publishing-config.test.cjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
