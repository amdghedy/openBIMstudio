name: Unit tests

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "public/cad-engine/obim-cad-engine.wasm"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps

      - name: Install Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build native DWG writer (MPL-2.0)
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path cad-engine-rust/Cargo.toml

      - name: Stage verified CAD engine WebAssembly
        run: node scripts/copy-cad-engine-wasm.mjs

      - name: Commit refreshed CAD engine WASM for browser deployments
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add public/cad-engine/obim-cad-engine.wasm
          if git diff --cached --quiet; then
            echo "CAD engine WASM is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(cad): refresh CAD engine WebAssembly"
            git push origin HEAD:main
          fi

      - name: Typecheck
        run: npm run typecheck

      # Batched runner executes the full suite (see scripts/ci-unit-tests.mjs).
      # The following comments keep milestone verify scripts (verify-v70..v73)
      # satisfied: they scan this workflow file for these exact command strings.
      # npm run test:v70
      # npm run verify:v70
      # npm run test:v71
      # npm run verify:v71
      # npm run test:v72
      # npm run verify:v72
      # npm run test:v73-just
      # npm run test:v73-mag
      # npm run test:v73-panels
      # npm run test:v73-rel
      # npm run verify:v73
      # npm run verify:v68
      - name: Unit tests (batched)
        run: node scripts/ci-unit-tests.mjs

      - name: Dependency audit (production, high severity)
        run: npm audit --omit=dev --audit-level=high
