name: Restore main boot
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full main.ts from 41edb8d
        run: |
          git checkout 41edb8d -- src/main.ts
          wc -c src/main.ts
          grep -n "setupAuthoring\|setupShell\|setupPluginSystem" src/main.ts
      - name: Commit and push
        run: |
          git config user.name "amdghedy"
          git config user.email "43811322+amdghedy@users.noreply.github.com"
          git add src/main.ts
          git commit -m "fix(boot): restore full main.ts from 41edb8d (authoring + all tools)" || echo "no change"
          git push origin HEAD:main
