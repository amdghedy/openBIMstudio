name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — API token with Account → Workers Scripts:Edit
#                          and Account → Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id
#
# Create token: https://dash.cloudflare.com/profile/api-tokens
# Use template "Edit Cloudflare Workers" (or custom with Workers Scripts Edit).

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Check Cloudflare secrets
        shell: bash
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add both secrets under Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy failure help
        if: failure()
        shell: bash
        run: |
          echo "::error::Cloudflare deploy failed (often: No access to the specified service)."
          echo "Fix: create an API token with Workers Scripts:Edit + Account Settings:Read,"
          echo "set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then re-run this workflow."
