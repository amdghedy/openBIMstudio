name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — API token with Account → Workers Scripts:Edit
#                          and Account → Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id (dashboard sidebar)
#
# Create token: https://dash.cloudflare.com/profile/api-tokens
# Template: "Edit Cloudflare Workers" or custom with Workers Scripts Edit.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Check Cloudflare secrets
        shell: bash
        run: |
          missing=0
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add both secrets under Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:0:4}… (masked)"
          # whoami validates the token can talk to the API
          npx wrangler whoami || {
            echo "::error::wrangler whoami failed — token is invalid or lacks Account read permission"
            exit 1
          }

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Use the wrangler version from package.json / node_modules
          packageManager: npm

      - name: Deploy failure help
        if: failure()
        shell: bash
        run: |
          cat <<'EOF'
          ::error::Cloudflare deploy failed.
          Common cause: API token cannot access Workers service "openbimstudio"
            → "No access to the specified service"

          Fix:
          1. Open https://dash.cloudflare.com/profile/api-tokens
          2. Create a token with permissions:
             - Account · Cloudflare Workers Scripts · Edit
             - Account · Account Settings · Read
          3. Confirm CLOUDFLARE_ACCOUNT_ID matches the account that owns the Worker
          4. Update GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
          5. Re-run this workflow (Actions → Deploy Worker → Re-run)
          EOF
