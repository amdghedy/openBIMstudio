name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — Workers Scripts:Edit + Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id
#
# Build the native CAD writer in CI and package it into dist. Never push
# generated binaries back to the protected main branch. The deployment
# consumes the freshly built artifact directly from this job.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build native DWG writer
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path cad-engine-rust/Cargo.toml

      - name: Stage freshly built CAD engine WebAssembly
        run: node scripts/copy-cad-engine-wasm.mjs

      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Check Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add both secrets under Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.153.0"
          command: deploy

      - name: Deploy failure help
        if: failure() && steps.deploy.conclusion == 'failure'
        shell: bash
        run: |
          echo "::error::Cloudflare deploy step failed."
          echo "Check Workers Scripts:Edit permission and CLOUDFLARE_ACCOUNT_ID."
