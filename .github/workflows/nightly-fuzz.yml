name: Nightly parser fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: true

jobs:
  ifc-fuzz:
    name: IFC corpus fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --legacy-peer-deps
      - name: Run deterministic 500-mutation fuzz gate
        env:
          FUZZ_ITER: 500
          FUZZ_SEED: 42
          FUZZ_CHILD_TIMEOUT_MS: 5000
          FUZZ_ARTIFACT_DIR: fuzz-artifacts
        run: npm run test:fuzz-ifc
      - name: Upload failing inputs and summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-ifc-fuzz-${{ github.run_id }}
          path: fuzz-artifacts/
          if-no-files-found: warn
          retention-days: 30
